services:
  postgres:
    image: postgres:16-alpine
    container_name: notification-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: pushnotificationdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pushnotificationdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: notification-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mail-service:
    build:
      context: ../Services/mail-service
    container_name: mail-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: local
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      MAIL_HOST: ${MAIL_HOST:-smtp.hostinger.com}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-${MAIL_USERNAME}}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Mail Service}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  telegram-service:
    build:
      context: ../telegram-service
    container_name: telegram-service
    ports:
      - "8081:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      ALGORYCODE_SITE_ASSISTANT_BOT_TOKEN: ${ALGORYCODE_SITE_ASSISTANT_BOT_TOKEN}
      ALGORYCODE_SITE_NOTIFICATION_BOT_TOKEN: ${ALGORYCODE_SITE_NOTIFICATION_BOT_TOKEN}
      ALGORYCODE_SITE_ASSISTANT_BOT_WEBHOOK_SECRET: ${ALGORYCODE_SITE_ASSISTANT_BOT_WEBHOOK_SECRET:-local-dev-secret}
      ALGORYCODE_SITE_ASSISTANT_BOT_WEBHOOK_URL: ${ALGORYCODE_SITE_ASSISTANT_BOT_WEBHOOK_URL:-http://localhost:8081/api/v1/algorysite/assistant/webhook}
      TELEGRAM_ALGORY_SITE_CHANNEL_ID: ${TELEGRAM_ALGORY_SITE_CHANNEL_ID}
      TELEGRAM_PAYMENT_SERVICE_CHANNEL_ID: ${TELEGRAM_PAYMENT_SERVICE_CHANNEL_ID:-}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  push-notification-service:
    build: .
    container_name: push-notification-service
    ports:
      - "8080:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: guest
      RABBITMQ_PASSWORD: guest
      DB_URL: jdbc:postgresql://postgres:5432/pushnotificationdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
    depends_on:
      postgres:
        condition: service_healthy
      mail-service:
        condition: service_healthy
      telegram-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  postgres_data:
